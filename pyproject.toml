[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triggercraft"
version = "0.1.0"
description = "Readable research tools for image dataset auditing and model evaluation"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
vision = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0"]
test = ["pytest>=8"]
generation = ["diffusers>=0.30", "transformers>=4.40", "accelerate>=0.30"]
vlm = ["transformers>=4.40", "accelerate>=0.30"]
reward = [
  "image-reward==1.5",
  "timm==0.6.13",
  "fairscale==0.4.13",
  "transformers==4.38.2",
  "huggingface-hub==0.25.2",
  "diffusers==0.27.2",
  "accelerate==0.27.2",
]

[tool.setuptools.packages.find]
include = ["triggercraft*"]
